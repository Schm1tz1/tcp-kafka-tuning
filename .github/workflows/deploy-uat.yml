name: Deploy UAT to GitHub Pages

on:
  push:
    branches: [uat]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TCP app
        working-directory: docker/tcp
        env:
          VITE_BASE: /tcp-kafka-tuning/uat/tcp/
        run: npm install && npm run build

      - name: Build Kafka app
        working-directory: docker/kafka
        env:
          VITE_BASE: /tcp-kafka-tuning/uat/kafka/
        run: npm install && npm run build

      - name: Assemble dist/
        run: |
          mkdir -p dist/tcp dist/kafka
          cp -r docker/tcp/dist/*   dist/tcp/
          cp -r docker/kafka/dist/* dist/kafka/
          cp static/index.html      dist/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/
          destination_dir: uat
          keep_files: true
